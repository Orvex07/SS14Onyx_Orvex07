- type: entity
  id: ActionTelepathy
  name: Telepathy
  description: Telepathically transmits a message to the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Onyx/Actions/actions_revenant.rsi
    layers:
    - state: transmit
  - type: TargetAction
    interactOnMiss: false
    range: 15
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:TelepathyWhisperEvent
  - type: TelepathyAction
    popupWhisperFlavor: telepathic-whisper-flavor
